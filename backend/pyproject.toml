[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="reelforge"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi","uvicorn[standard]","pydantic>=2.8","pydantic-settings","aiosqlite","openai","httpx","duckduckgo-search","trafilatura","typer","jinja2","playwright","edge-tts","espeakng-loader>=0.2.4","pytest","pytest-asyncio","ruff"]

[tool.setuptools.packages.find]
include=["app*"]
namespaces=true

[tool.setuptools.package-data]
app=["templates/*.html"]
