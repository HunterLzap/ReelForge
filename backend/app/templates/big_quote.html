{% extends 'base.html' %}
{% block content %}
<div class="quote-mark">“</div>
<blockquote>
{% if p.highlight in p.quote %}
  {% set before,after = p.quote.split(p.highlight,1) %}
  {{ before }}<mark>{{ p.highlight }}</mark>{{ after }}
{% else %}{{ p.quote }}{% endif %}
</blockquote>
<p class="byline">— {{ p.attribution }}</p>
{% endblock %}
