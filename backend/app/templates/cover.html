{% extends 'base.html' %}
{% block content %}
<div class="front">
  <div class="front-copy">
    <span class="label">{{ p.tag }}</span>
    <h1>{{ p.title }}</h1>
    <p>{{ p.subtitle }}</p>
  </div>
  {% if image_uri %}<img class="cover-photo" src="{{ image_uri }}" alt="">
  {% else %}<div aria-hidden="true" class="ornament {{ p.cover_style or 'grid' }}">{% for i in range(8) %}<i style="--i:{{ i }}"></i>{% endfor %}</div>{% endif %}

</div>
{% endblock %}
