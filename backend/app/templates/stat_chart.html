{% extends 'base.html' %}{% block content %}<h2>{{p.heading}}</h2>{% set scale=([p.bars|map(attribute='value')|map('abs')|max,1]|max) %}{% for b in p.bars %}<section>{{b.label}}　<svg viewBox="0 0 100 10" preserveAspectRatio="none"><rect width="{{100*b.value|abs/scale}}" height="10" fill="{{b.accent}}"/></svg>　{{b.value}} {{p.unit}}</section>{% endfor %}<aside>{{p.takeaway}}</aside>{% endblock %}
