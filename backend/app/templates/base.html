<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
{% include "editorial.css" %}
{% if font_data %}
@font-face { font-family: Local; src: url(data:font/ttf;base64,{{ font_data }}); }
{% endif %}
</style>
</head>
<body class="{{ theme }} {{ target_format }} {{ kind }}">
<div class="sheet">
  <header>
    <span><i></i>{{ section }}</span>
    {% if brand %}<b>{{ brand }}</b>{% endif %}
  </header>
  <main><article>{% block content %}{% endblock %}</article></main>
  <footer>
    <span>{{ topic }}</span>
    <div class="pagination">
      {% if target_format == 'cards_3_4' %}
      {% for n in range(count) %}<i class="{{ 'current' if loop.index == index else '' }}"></i>{% endfor %}
      {% endif %}
      <b>{{ "%02d"|format(index) }} / {{ "%02d"|format(count) }}</b>
    </div>
  </footer>
</div>
</body>
</html>
