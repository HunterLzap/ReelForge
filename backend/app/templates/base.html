<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
{% if font_data %}@font-face{font-family:Local;src:url(data:application/octet-stream;base64,{{font_data}})}{% endif %}
*{box-sizing:border-box}body{--bg:#192d32;--ink:#f7f1df;--muted:#a8b8ae;--accent:#fdbb61;margin:0;background:var(--bg);color:var(--ink);font-family:Local,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;height:100vh;padding:6vmin 8vmin 14vmin;display:flex;flex-direction:column}
.clean_light{--bg:#f2f5ee;--ink:#122f35;--muted:#536864;--accent:#167569}.warm_amber{--bg:#f3dfb7;--ink:#352c22;--muted:#776249;--accent:#a34725}
header,footer{display:flex;justify-content:space-between;align-items:center;font:600 2.45vmin/1.5 sans-serif;letter-spacing:.08em;color:var(--muted)}
header{border-bottom:2px solid var(--muted);padding-bottom:2vmin}header b{color:var(--accent)}main{flex:1;min-height:0;display:grid;align-items:center}article{font-size:4.4vmin;line-height:1.38;overflow-wrap:anywhere;width:100%}h1,h2,h3,p{margin:.3em 0}h1{font-size:2.45em;line-height:1.14;letter-spacing:-.05em}h2{font-size:1.55em}small,aside{color:var(--muted);font-size:.72em}em{font-style:normal;color:var(--accent)}section{border-top:1px solid var(--muted);padding:.32em 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:1em}svg{width:45%;height:.52em}footer{border-top:1px solid var(--muted);padding-top:1.3vmin}footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:82%}
</style><body class="{{theme}}"><header><b>映铸 / REELFORGE</b><span>编辑手记</span></header><main><article>{% block content %}{% endblock %}</article></main><footer><span>{{topic}}</span><b>{{'%02d'|format(index)}} / {{'%02d'|format(count)}}</b></footer></body></html>
